<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0; padding:0; background-color:#f2f2f2; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f2f2f2" style="width:100%; background-color:#f2f2f2;">
    <tr>
        <td align="center" style="padding:40px 16px;">

            <table role="presentation" width="580" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%; max-width:580px; background-color:#ffffff; border:1px solid #e5e5e5;">

                <!-- 로고 + 워드마크 -->
                <tr>
                    <td align="center" style="padding:28px 36px 24px 36px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
                            <tr>
                                <td valign="middle" style="padding-right:10px;">
                                    <img src="{{logoUrl}}" alt="" width="48" height="34" style="width:48px; height:34px; display:block; border:0; outline:none; text-decoration:none;">
                                </td>
                                <td valign="middle">
                                    <div style="font-size:25px; font-weight:700; letter-spacing:-0.7px; color:#111111; line-height:1; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">Halo</div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- 구분선 -->
                <tr>
                    <td style="padding:0 36px;">
                        <div style="border-top:1px solid #ebebeb; font-size:0; line-height:0;">&nbsp;</div>
                    </td>
                </tr>

                <!-- 본문 (좌측 정렬) -->
                <tr>
                    <td align="left" style="padding:24px 36px 26px 36px;">
                        <p style="margin:0 0 18px 0; font-size:15px; line-height:1.55; color:#444444; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">안녕하세요, <strong style="color:#111111;">{{username}}</strong>님.<br>아래 인증 코드를 앱에 입력해주세요.</p>

                        <!-- 코드 박스 -->
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%; background-color:#ffffff; border:1.5px solid #d8d8d8; margin:0 0 13px 0;">
                            <tr>
                                <td align="center" style="padding:18px 0;">
                                    <div style="font-size:30px; font-weight:700; letter-spacing:8px; text-indent:8px; color:#111111; line-height:1.1; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">{{code}}</div>
                                </td>
                            </tr>
                        </table>

                        <p style="margin:0 0 3px 0; font-size:13px; line-height:1.55; color:#777777; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">인증 코드는 {{expiryMinutes}}분 동안 유효합니다.</p>

                        <p style="margin:0; font-size:13px; line-height:1.55; color:#999999; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">{{note}}</p>
                    </td>
                </tr>

                <!-- 구분선 -->
                <tr>
                    <td style="padding:0 36px;">
                        <div style="border-top:1px solid #ebebeb; font-size:0; line-height:0;">&nbsp;</div>
                    </td>
                </tr>

                <!-- 푸터 -->
                <tr>
                    <td align="left" style="padding:13px 36px 16px 36px;">
                        <p style="margin:0; font-size:12px; color:#aaaaaa; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">&copy; 2026 Halo</p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>
</body>
</html>
